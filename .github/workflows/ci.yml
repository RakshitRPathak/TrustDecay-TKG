name: smoke-test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  quick-run:
    # Runs the whole pipeline end to end at reduced size (main.py --quick), with the pinned library versions.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: environment/requirements.txt
      - run: pip install -r environment/requirements.txt
      - run: python -u main.py --quick
        working-directory: code
